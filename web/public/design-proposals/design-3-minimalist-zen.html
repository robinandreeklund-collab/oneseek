<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 3: Minimalist Zen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 700px;
            padding: 0 40px;
        }
        
        /* Minimal header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(250, 250, 250, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e5e5;
            z-index: 100;
        }
        
        .logo {
            font-size: 20px;
            font-weight: 600;
            color: #171717;
            letter-spacing: -0.5px;
        }
        
        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #171717;
            border-radius: 50%;
            margin-left: 4px;
        }
        
        .header-right {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        .header-link {
            font-size: 14px;
            color: #737373;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .header-link:hover {
            color: #171717;
        }
        
        /* Main content - ultra minimal */
        .main-content {
            padding-top: 100px;
            display: flex;
            flex-direction: column;
            gap: 80px;
        }
        
        .title-section {
            text-align: center;
        }
        
        .zen-circle {
            width: 60px;
            height: 60px;
            margin: 0 auto 32px;
            border: 2px solid #171717;
            border-radius: 50%;
            position: relative;
        }
        
        .zen-circle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #171717;
            border-radius: 50%;
        }
        
        .main-title {
            font-size: 48px;
            font-weight: 300;
            color: #171717;
            margin-bottom: 16px;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        
        .zen-subtitle {
            font-size: 16px;
            color: #737373;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        
        /* Minimal input */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .input-line {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #171717;
        }
        
        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 18px;
            color: #171717;
            font-weight: 300;
        }
        
        .input-field::placeholder {
            color: #a3a3a3;
        }
        
        .send-circle {
            width: 36px;
            height: 36px;
            border: 1px solid #171717;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
        }
        
        .send-circle:hover {
            background: #171717;
        }
        
        .send-circle:hover svg {
            stroke: #fafafa;
        }
        
        .send-circle svg {
            width: 18px;
            height: 18px;
            stroke: #171717;
            stroke-width: 1.5;
            fill: none;
            transition: stroke 0.3s ease;
        }
        
        /* Minimal options */
        .options {
            display: flex;
            gap: 32px;
            justify-content: center;
        }
        
        .option {
            font-size: 14px;
            color: #737373;
            cursor: pointer;
            padding: 8px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        
        .option:hover {
            color: #171717;
            border-bottom-color: #171717;
        }
        
        /* Suggestions - minimal cards */
        .suggestions-zen {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 60px;
        }
        
        .zen-card {
            padding: 28px;
            border: 1px solid #e5e5e5;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .zen-card:hover {
            border-color: #171717;
            transform: translateY(-4px);
        }
        
        .card-label {
            font-size: 12px;
            color: #a3a3a3;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        .card-title {
            font-size: 16px;
            color: #171717;
            font-weight: 400;
            line-height: 1.5;
        }
        
        /* Floating element animation */
        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }
        
        .breath-element {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(23, 23, 23, 0.03) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: breathe 8s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="breath-element"></div>
    
    <div class="header">
        <div class="logo">
            OneSeek<span class="dot"></span>
        </div>
        <div class="header-right">
            <a href="#" class="header-link">Dokumentation</a>
            <a href="#" class="header-link">Inställningar</a>
        </div>
    </div>
    
    <div class="container">
        <div class="main-content">
            <div class="title-section">
                <div class="zen-circle"></div>
                <h1 class="main-title">Klarhet i komplexitet</h1>
                <p class="zen-subtitle">Enkelhet är den ultimata sofistikeringen</p>
            </div>
            
            <div class="input-area">
                <div class="input-line">
                    <input 
                        type="text" 
                        class="input-field" 
                        placeholder="Vad söker du efter?"
                    />
                    <button class="send-circle">
                        <svg viewBox="0 0 24 24">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </button>
                </div>
                
                <div class="options">
                    <div class="option">Fokuserad</div>
                    <div class="option">Balanserad</div>
                    <div class="option">Kreativ</div>
                </div>
            </div>
            
            <div class="suggestions-zen">
                <div class="zen-card">
                    <div class="card-label">Research</div>
                    <div class="card-title">Djup forskningsanalys med källor</div>
                </div>
                <div class="zen-card">
                    <div class="card-label">Create</div>
                    <div class="card-title">Generera bilder och konst</div>
                </div>
                <div class="zen-card">
                    <div class="card-label">Analyze</div>
                    <div class="card-title">Dataanalys och insikter</div>
                </div>
                <div class="zen-card">
                    <div class="card-label">Learn</div>
                    <div class="card-title">Interaktiv lärande</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
