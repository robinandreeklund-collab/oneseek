<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 8: Floating Elements 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0c0c1d 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            overflow-x: hidden;
        }
        
        /* Floating particles background */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.3);
            animation: float 20s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translate3d(0, 0, 0); }
            25% { transform: translate3d(50px, -50px, 50px); }
            50% { transform: translate3d(-30px, 30px, -30px); }
            75% { transform: translate3d(30px, 50px, 50px); }
        }
        
        .container-3d {
            width: 90%;
            max-width: 1000px;
            position: relative;
            z-index: 10;
        }
        
        /* 3D Header floating */
        .header-3d {
            text-align: center;
            margin-bottom: 80px;
            transform: translateZ(50px);
            animation: headerFloat 6s ease-in-out infinite;
        }
        
        @keyframes headerFloat {
            0%, 100% { transform: translateZ(50px) translateY(0); }
            50% { transform: translateZ(50px) translateY(-10px); }
        }
        
        .logo-3d {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 
                0 20px 40px rgba(139, 92, 246, 0.4),
                0 0 100px rgba(139, 92, 246, 0.2);
            transform-style: preserve-3d;
            animation: logoRotate 10s linear infinite;
        }
        
        @keyframes logoRotate {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        
        .title-3d {
            font-size: 56px;
            font-weight: 700;
            color: white;
            margin-bottom: 16px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle-3d {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Main 3D card */
        .card-3d {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 50px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
            transform: translateZ(0);
            transition: transform 0.3s ease;
        }
        
        .card-3d:hover {
            transform: translateZ(20px);
        }
        
        /* Floating input elements */
        .input-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .input-layer {
            position: relative;
            transform-style: preserve-3d;
        }
        
        .input-layer:nth-child(1) { transform: translateZ(30px); }
        .input-layer:nth-child(2) { transform: translateZ(20px); }
        .input-layer:nth-child(3) { transform: translateZ(10px); }
        
        .input-3d {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px 28px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .input-3d:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #8b5cf6;
            box-shadow: 
                0 0 0 4px rgba(139, 92, 246, 0.2),
                0 15px 40px rgba(0, 0, 0, 0.3);
            transform: translateZ(10px);
        }
        
        .input-3d::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        
        /* Floating controls */
        .controls-3d {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 30px;
            transform: translateZ(40px);
        }
        
        .mode-group {
            display: flex;
            gap: 12px;
        }
        
        .mode-orb {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
            transform-style: preserve-3d;
        }
        
        .mode-orb:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: #8b5cf6;
            transform: translateZ(15px) scale(1.1);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }
        
        .send-3d {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 
                0 15px 40px rgba(139, 92, 246, 0.5),
                0 0 60px rgba(236, 72, 153, 0.3);
            transition: all 0.3s ease;
            transform-style: preserve-3d;
        }
        
        .send-3d:hover {
            transform: translateZ(25px) scale(1.15) rotate(15deg);
            box-shadow: 
                0 20px 50px rgba(139, 92, 246, 0.6),
                0 0 80px rgba(236, 72, 153, 0.4);
        }
        
        .send-3d svg {
            width: 28px;
            height: 28px;
            stroke: white;
            stroke-width: 3;
            fill: none;
        }
        
        /* Floating feature cards */
        .features-3d {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }
        
        .feature-float {
            padding: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .feature-float:nth-child(1) { transform: translateZ(20px); }
        .feature-float:nth-child(2) { transform: translateZ(30px); }
        .feature-float:nth-child(3) { transform: translateZ(20px); }
        
        .feature-float:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(139, 92, 246, 0.5);
            transform: translateZ(50px) rotateX(10deg);
            box-shadow: 
                0 20px 50px rgba(139, 92, 246, 0.3),
                0 0 60px rgba(139, 92, 246, 0.2);
        }
        
        .feature-icon-3d {
            font-size: 36px;
            margin-bottom: 12px;
            display: block;
            animation: iconFloat 3s ease-in-out infinite;
        }
        
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .feature-float:nth-child(2) .feature-icon-3d {
            animation-delay: -1s;
        }
        
        .feature-float:nth-child(3) .feature-icon-3d {
            animation-delay: -2s;
        }
        
        .feature-title-3d {
            font-size: 15px;
            font-weight: 600;
            color: white;
            margin-bottom: 6px;
        }
        
        .feature-desc-3d {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <div class="particle" style="width: 100px; height: 100px; top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="particle" style="width: 60px; height: 60px; top: 60%; left: 10%; animation-delay: -5s;"></div>
    <div class="particle" style="width: 80px; height: 80px; top: 30%; right: 15%; animation-delay: -10s;"></div>
    <div class="particle" style="width: 50px; height: 50px; bottom: 20%; right: 10%; animation-delay: -15s;"></div>
    
    <div class="container-3d">
        <div class="header-3d">
            <div class="logo-3d">S</div>
            <h1 class="title-3d">OneSeek 3D</h1>
            <p class="subtitle-3d">En dimension av intelligens</p>
        </div>
        
        <div class="card-3d">
            <div class="input-stack">
                <div class="input-layer">
                    <input 
                        type="text" 
                        class="input-3d" 
                        placeholder="Skriv din fråga här..."
                    />
                </div>
            </div>
            
            <div class="controls-3d">
                <div class="mode-group">
                    <div class="mode-orb" title="Research">🔍</div>
                    <div class="mode-orb" title="Creative">🎨</div>
                    <div class="mode-orb" title="Code">💻</div>
                </div>
                <button class="send-3d">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                </button>
            </div>
            
            <div class="features-3d">
                <div class="feature-float">
                    <span class="feature-icon-3d">🚀</span>
                    <div class="feature-title-3d">Snabb</div>
                    <div class="feature-desc-3d">Blixtsnabba svar</div>
                </div>
                <div class="feature-float">
                    <span class="feature-icon-3d">🧠</span>
                    <div class="feature-title-3d">Smart</div>
                    <div class="feature-desc-3d">Avancerad AI</div>
                </div>
                <div class="feature-float">
                    <span class="feature-icon-3d">🔒</span>
                    <div class="feature-title-3d">Säker</div>
                    <div class="feature-desc-3d">Krypterad data</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Add 3D tilt effect to card
        const card = document.querySelector('.card-3d');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = (y - centerY) / 20;
            const rotateY = (centerX - x) / 20;
            
            if (e.clientX >= rect.left && e.clientX <= rect.right && 
                e.clientY >= rect.top && e.clientY <= rect.bottom) {
                card.style.transform = `translateZ(0) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            } else {
                card.style.transform = 'translateZ(0) rotateX(0) rotateY(0)';
            }
        });
    </script>
</body>
</html>
