<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 6: Split Screen Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
        }
        
        /* Split screen layout */
        .split-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        
        /* Left panel - Navigation & Info */
        .left-panel {
            width: 35%;
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 40px;
        }
        
        .pro-header {
            margin-bottom: 60px;
        }
        
        .logo-pro {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }
        
        .logo-square {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }
        
        .brand-pro {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .nav-item {
            padding: 14px 20px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 15px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        
        .nav-item.active {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }
        
        .info-section {
            margin-top: auto;
            padding: 24px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .info-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }
        
        .info-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .info-stat:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .stat-value {
            font-size: 14px;
            font-weight: 600;
            color: #3b82f6;
        }
        
        /* Right panel - Main workspace */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            background: #0f0f0f;
        }
        
        .workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .breadcrumb-sep {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .workspace-actions {
            display: flex;
            gap: 12px;
        }
        
        .action-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        /* Main content area */
        .workspace-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 800px;
        }
        
        .pro-welcome {
            margin-bottom: 50px;
        }
        
        .pro-title {
            font-size: 52px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        
        .pro-subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
        }
        
        /* Professional input */
        .pro-input-wrapper {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }
        
        .pro-input-wrapper:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        
        .pro-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            padding: 8px 0;
            font-family: 'Inter', sans-serif;
        }
        
        .pro-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .mode-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px;
            border-radius: 10px;
        }
        
        .mode-tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .mode-tab:hover {
            color: #fff;
        }
        
        .mode-tab.active {
            background: #3b82f6;
            color: #fff;
        }
        
        .submit-pro {
            padding: 12px 28px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-pro:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        
        /* Feature cards */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        .feature-card {
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .feature-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }
        
        .feature-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }
        
        .feature-name {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
        }
        
        .feature-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="split-container">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="pro-header">
                <div class="logo-pro">
                    <div class="logo-square">S</div>
                    <div class="brand-pro">OneSeek</div>
                </div>
                
                <nav class="nav-menu">
                    <button class="nav-item active">
                        <span>💬</span> Ny Konversation
                    </button>
                    <button class="nav-item">
                        <span>📚</span> Bibliotek
                    </button>
                    <button class="nav-item">
                        <span>⭐</span> Favoriter
                    </button>
                    <button class="nav-item">
                        <span>📊</span> Statistik
                    </button>
                    <button class="nav-item">
                        <span>⚙️</span> Inställningar
                    </button>
                </nav>
            </div>
            
            <div class="info-section">
                <div class="info-title">Session Info</div>
                <div class="info-stat">
                    <span class="stat-label">Modell</span>
                    <span class="stat-value">GPT-4</span>
                </div>
                <div class="info-stat">
                    <span class="stat-label">Status</span>
                    <span class="stat-value">Aktiv</span>
                </div>
                <div class="info-stat">
                    <span class="stat-label">Tokens</span>
                    <span class="stat-value">2.5K</span>
                </div>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="right-panel">
            <div class="workspace-header">
                <div class="breadcrumb">
                    <span>Hem</span>
                    <span class="breadcrumb-sep">/</span>
                    <span>Ny Session</span>
                </div>
                <div class="workspace-actions">
                    <button class="action-btn">📋 Historik</button>
                    <button class="action-btn">🔍 Sök</button>
                </div>
            </div>
            
            <div class="workspace-content">
                <div class="pro-welcome">
                    <h1 class="pro-title">
                        Professionell AI-assistent för ditt arbete
                    </h1>
                    <p class="pro-subtitle">
                        Kraftfull, snabb och säker. OneSeek Pro ger dig tillgång till avancerad AI för alla dina behov.
                    </p>
                </div>
                
                <div class="pro-input-wrapper">
                    <input 
                        type="text" 
                        class="pro-input" 
                        placeholder="Beskriv din uppgift eller ställ en fråga..."
                    />
                    <div class="input-footer">
                        <div class="mode-tabs">
                            <button class="mode-tab active">Balanserad</button>
                            <button class="mode-tab">Kreativ</button>
                            <button class="mode-tab">Precis</button>
                        </div>
                        <button class="submit-pro">Skicka →</button>
                    </div>
                </div>
                
                <div class="feature-grid">
                    <div class="feature-card">
                        <div class="feature-icon">🔍</div>
                        <div class="feature-name">Research</div>
                        <div class="feature-desc">Djup analys</div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">✍️</div>
                        <div class="feature-name">Skriv</div>
                        <div class="feature-desc">Skapa innehåll</div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">💻</div>
                        <div class="feature-name">Kod</div>
                        <div class="feature-desc">Programmering</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
