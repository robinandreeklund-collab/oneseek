<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 10: Liquid Motion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Animated liquid background */
        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .liquid-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: liquidMove 30s ease-in-out infinite;
        }
        
        .blob-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            top: -200px;
            left: -100px;
            animation-delay: 0s;
        }
        
        .blob-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            bottom: -150px;
            right: -100px;
            animation-delay: -10s;
        }
        
        .blob-3 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -20s;
        }
        
        @keyframes liquidMove {
            0%, 100% { 
                transform: translate(0, 0) scale(1);
                border-radius: 50% 40% 50% 40%;
            }
            25% { 
                transform: translate(100px, -100px) scale(1.2);
                border-radius: 40% 50% 40% 50%;
            }
            50% { 
                transform: translate(-50px, 50px) scale(0.9);
                border-radius: 50% 40% 60% 30%;
            }
            75% { 
                transform: translate(150px, 100px) scale(1.1);
                border-radius: 30% 60% 40% 50%;
            }
        }
        
        .container-liquid {
            width: 90%;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }
        
        /* Morphing header */
        .header-liquid {
            text-align: center;
            margin-bottom: 60px;
        }
        
        .logo-liquid {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            background-size: 200% 200%;
            animation: liquidGradient 8s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            position: relative;
        }
        
        .logo-liquid::before {
            content: '';
            position: absolute;
            inset: -4px;
            background: inherit;
            border-radius: inherit;
            filter: blur(20px);
            opacity: 0.5;
            z-index: -1;
            animation: morphShape 8s ease-in-out infinite;
        }
        
        @keyframes liquidGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes morphShape {
            0%, 100% { border-radius: 50% 40% 50% 40% / 40% 50% 40% 50%; }
            25% { border-radius: 40% 50% 40% 50% / 50% 40% 50% 40%; }
            50% { border-radius: 50% 40% 60% 30% / 30% 60% 40% 50%; }
            75% { border-radius: 30% 60% 40% 50% / 50% 40% 50% 40%; }
        }
        
        .logo-liquid {
            border-radius: 50% 40% 50% 40% / 40% 50% 40% 50%;
            animation: 
                liquidGradient 8s ease infinite,
                morphShape 8s ease-in-out infinite;
        }
        
        .title-liquid {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            animation: liquidGradient 8s ease infinite;
            background-size: 200% 200%;
        }
        
        .subtitle-liquid {
            font-size: 20px;
            color: #6b7280;
        }
        
        /* Liquid morphing card */
        .card-liquid {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(30px);
            border-radius: 40px;
            padding: 50px 45px;
            box-shadow: 
                0 30px 90px rgba(102, 126, 234, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.9);
            position: relative;
            overflow: hidden;
            animation: cardMorph 10s ease-in-out infinite;
        }
        
        @keyframes cardMorph {
            0%, 100% { border-radius: 40px; }
            25% { border-radius: 50px 40px 50px 40px; }
            50% { border-radius: 40px 50px 40px 50px; }
            75% { border-radius: 45px 40px 55px 35px; }
        }
        
        .card-liquid::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(102, 126, 234, 0.1) 50%,
                transparent 70%
            );
            animation: liquidShine 6s linear infinite;
        }
        
        @keyframes liquidShine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Morphing input */
        .input-liquid-wrapper {
            position: relative;
            margin-bottom: 32px;
        }
        
        .input-liquid {
            width: 100%;
            background: white;
            border: 2px solid transparent;
            border-radius: 30px;
            padding: 24px 28px;
            font-size: 16px;
            color: #1f2937;
            outline: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            animation: inputMorph 8s ease-in-out infinite;
        }
        
        @keyframes inputMorph {
            0%, 100% { border-radius: 30px; }
            25% { border-radius: 35px 25px 35px 25px; }
            50% { border-radius: 25px 35px 25px 35px; }
            75% { border-radius: 32px 28px 32px 28px; }
        }
        
        .input-liquid:focus {
            border-color: #667eea;
            box-shadow: 
                0 0 0 4px rgba(102, 126, 234, 0.1),
                0 8px 30px rgba(102, 126, 234, 0.15);
        }
        
        .input-liquid::placeholder {
            color: #9ca3af;
        }
        
        /* Floating controls */
        .controls-liquid {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }
        
        .mode-liquid {
            display: flex;
            gap: 12px;
        }
        
        .mode-bubble {
            padding: 12px 24px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 25px;
            font-size: 14px;
            color: #667eea;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: bubbleMorph 6s ease-in-out infinite;
            animation-delay: calc(var(--delay) * 1s);
        }
        
        .mode-bubble:nth-child(1) { --delay: 0; }
        .mode-bubble:nth-child(2) { --delay: 0.5; }
        .mode-bubble:nth-child(3) { --delay: 1; }
        
        @keyframes bubbleMorph {
            0%, 100% { border-radius: 25px; transform: scale(1); }
            50% { border-radius: 18px; transform: scale(1.05); }
        }
        
        .mode-bubble:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-color: #667eea;
            transform: translateY(-3px) scale(1.1);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }
        
        .send-liquid {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: sendMorph 4s ease-in-out infinite;
        }
        
        @keyframes sendMorph {
            0%, 100% { 
                border-radius: 50%;
                transform: rotate(0deg);
            }
            50% { 
                border-radius: 40%;
                transform: rotate(180deg);
            }
        }
        
        .send-liquid:hover {
            transform: scale(1.2) rotate(360deg);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
            animation-play-state: paused;
        }
        
        .send-liquid svg {
            width: 26px;
            height: 26px;
            stroke: white;
            stroke-width: 2.5;
            fill: none;
        }
        
        /* Flowing suggestions */
        .suggestions-liquid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 32px;
            position: relative;
            z-index: 2;
        }
        
        .suggestion-flow {
            padding: 14px 24px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(102, 126, 234, 0.15);
            border-radius: 22px;
            font-size: 15px;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: suggestionFloat 3s ease-in-out infinite;
            animation-delay: calc(var(--index) * 0.3s);
        }
        
        .suggestion-flow:nth-child(1) { --index: 0; }
        .suggestion-flow:nth-child(2) { --index: 1; }
        .suggestion-flow:nth-child(3) { --index: 2; }
        .suggestion-flow:nth-child(4) { --index: 3; }
        
        @keyframes suggestionFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        .suggestion-flow:hover {
            background: white;
            border-color: #667eea;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.25);
        }
    </style>
</head>
<body>
    <div class="liquid-bg">
        <div class="liquid-blob blob-1"></div>
        <div class="liquid-blob blob-2"></div>
        <div class="liquid-blob blob-3"></div>
    </div>
    
    <div class="container-liquid">
        <div class="header-liquid">
            <div class="logo-liquid">S</div>
            <h1 class="title-liquid">OneSeek Liquid</h1>
            <p class="subtitle-liquid">Flöda med intelligens</p>
        </div>
        
        <div class="card-liquid">
            <div class="input-liquid-wrapper">
                <input 
                    type="text" 
                    class="input-liquid" 
                    placeholder="Låt dina tankar flyta fritt..."
                />
            </div>
            
            <div class="controls-liquid">
                <div class="mode-liquid">
                    <div class="mode-bubble">🌊 Flöde</div>
                    <div class="mode-bubble">✨ Kreativ</div>
                    <div class="mode-bubble">🎯 Fokus</div>
                </div>
                <button class="send-liquid">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                </button>
            </div>
            
            <div class="suggestions-liquid">
                <div class="suggestion-flow">🔍 Forskningsdjup</div>
                <div class="suggestion-flow">🎨 Skapa konst</div>
                <div class="suggestion-flow">💡 Generera idéer</div>
                <div class="suggestion-flow">📊 Analysera data</div>
            </div>
        </div>
    </div>
</body>
</html>
