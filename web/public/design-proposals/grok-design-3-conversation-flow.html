<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok-Inspired 3: Conversation Flow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8f9fa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        
        .logo { font-size: 22px; font-weight: 700; color: #212529; }
        
        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .btn {
            padding: 8px 16px;
            border: 1px solid #dee2e6;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn:hover { background: #f8f9fa; }
        
        .btn-primary {
            background: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }
        
        .btn-primary:hover { background: #0b5ed7; }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .user-avatar { background: #e7f3ff; }
        .ai-avatar { background: #f0f0f0; }
        
        .message-content {
            flex: 1;
            padding: 12px 16px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e9ecef;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .author {
            font-weight: 600;
            font-size: 14px;
            color: #212529;
        }
        
        .timestamp {
            font-size: 12px;
            color: #6c757d;
        }
        
        .message-text {
            font-size: 15px;
            line-height: 1.6;
            color: #212529;
        }
        
        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .empty-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #212529;
        }
        
        .empty-subtitle {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 32px;
        }
        
        .quick-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .quick-action {
            padding: 12px 20px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .quick-action:hover {
            background: #f8f9fa;
            border-color: #0d6efd;
            transform: translateY(-2px);
        }
        
        .input-area {
            margin-top: 24px;
            background: white;
            border: 2px solid #dee2e6;
            border-radius: 16px;
            padding: 12px;
            transition: border-color 0.2s;
        }
        
        .input-area:focus-within {
            border-color: #0d6efd;
        }
        
        .input-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        textarea {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            min-height: 24px;
            max-height: 150px;
        }
        
        .send-btn {
            width: 40px;
            height: 40px;
            background: #0d6efd;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .send-btn:hover { background: #0b5ed7; }
        
        .input-tools {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            padding: 4px 0;
        }
        
        .tool-btn {
            padding: 6px 12px;
            background: #f8f9fa;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .tool-btn:hover { background: #e9ecef; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">OneSeek</div>
        <div class="header-right">
            <button class="btn">🔍 Sök</button>
            <button class="btn">📂 Projekt</button>
            <button class="btn-primary">+ Ny chat</button>
        </div>
    </div>
    
    <div class="chat-container">
        <div class="messages">
            <div class="empty-state">
                <div class="empty-icon">💬</div>
                <h1 class="empty-title">Starta en konversation</h1>
                <p class="empty-subtitle">Jag kan hjälpa dig med research, kreativ skrivning, kodning och mycket mer</p>
                
                <div class="quick-actions">
                    <div class="quick-action">💡 Brainstorma idéer</div>
                    <div class="quick-action">🔍 Undersök ett ämne</div>
                    <div class="quick-action">💻 Skriv kod</div>
                    <div class="quick-action">📊 Analysera data</div>
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-row">
                <textarea placeholder="Skriv ditt meddelande..."></textarea>
                <button class="send-btn">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
            <div class="input-tools">
                <button class="tool-btn">📎 Bifoga</button>
                <button class="tool-btn">��️ Bild</button>
                <button class="tool-btn">🎤 Röst</button>
                <button class="tool-btn">⚡ Snabbsvar</button>
            </div>
        </div>
    </div>
</body>
</html>
