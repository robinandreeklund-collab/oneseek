<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 4: Neon Cyberpunk</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Cyberpunk grid background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            perspective: 1000px;
            transform: rotateX(60deg);
            transform-origin: 50% 100%;
        }
        
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }
        
        /* Neon glow effects */
        .neon-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                #00ffff, 
                transparent
            );
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            animation: neonScan 4s linear infinite;
        }
        
        .neon-line-1 { top: 20%; left: 0; width: 100%; }
        .neon-line-2 { top: 60%; left: 0; width: 100%; animation-delay: 2s; }
        
        @keyframes neonScan {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
        
        .container {
            width: 90%;
            max-width: 900px;
            position: relative;
            z-index: 10;
        }
        
        /* Cyberpunk header */
        .cyber-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
            padding: 20px;
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid #00ffff;
            box-shadow: 
                0 0 10px rgba(0, 255, 255, 0.5),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
        }
        
        .cyber-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-hex {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px currentColor;
            animation: hexPulse 2s ease-in-out infinite;
        }
        
        @keyframes hexPulse {
            0%, 100% { box-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff; }
            50% { box-shadow: 0 0 20px #00ffff, 0 0 40px #ff00ff; }
        }
        
        .cyber-brand {
            font-size: 28px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            letter-spacing: 4px;
        }
        
        .cyber-status {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #00ff00;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
            animation: blink 1.5s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* Main terminal-style interface */
        .terminal-box {
            background: rgba(10, 10, 15, 0.9);
            border: 2px solid #00ffff;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.5),
                inset 0 0 30px rgba(0, 255, 255, 0.1);
            padding: 40px;
            position: relative;
        }
        
        .terminal-box::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            z-index: -1;
            filter: blur(10px);
            opacity: 0.5;
            animation: borderGlow 3s linear infinite;
        }
        
        @keyframes borderGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        .terminal-header {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }
        
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .dot-1 { background: #ff00ff; box-shadow: 0 0 10px #ff00ff; }
        .dot-2 { background: #ffff00; box-shadow: 0 0 10px #ffff00; }
        .dot-3 { background: #00ffff; box-shadow: 0 0 10px #00ffff; }
        
        .welcome-cyber {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .cyber-title {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            animation: titleGlow 2s ease-in-out infinite;
        }
        
        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 5px #00ffff); }
            50% { filter: drop-shadow(0 0 15px #ff00ff); }
        }
        
        .cyber-subtitle {
            font-size: 16px;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .cyber-subtitle::before {
            content: '> ';
            color: #00ffff;
        }
        
        /* Input terminal */
        .input-terminal {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00ffff;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .input-line {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .prompt {
            color: #00ffff;
            font-size: 16px;
        }
        
        .cyber-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            font-family: 'Courier New', monospace;
        }
        
        .cyber-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .mode-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .mode-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid #ff00ff;
            color: #ff00ff;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        }
        
        .mode-btn:hover {
            background: #ff00ff;
            color: #0a0a0f;
            box-shadow: 0 0 15px #ff00ff;
        }
        
        .send-cyber {
            padding: 12px 32px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            color: #0a0a0f;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        
        .send-cyber:hover {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            transform: translateY(-2px);
        }
        
        /* Quick commands */
        .quick-commands {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .command-card {
            padding: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
        }
        
        .command-card:hover {
            border-color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        
        .command-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }
        
        .command-text {
            font-size: 13px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="neon-line neon-line-1"></div>
    <div class="neon-line neon-line-2"></div>
    
    <div class="container">
        <div class="cyber-header">
            <div class="cyber-logo">
                <div class="logo-hex">S</div>
                <div class="cyber-brand">ONESEEK</div>
            </div>
            <div class="cyber-status">
                <div class="status-item">
                    <div class="status-dot"></div>
                    <span>ONLINE</span>
                </div>
                <div class="status-item">
                    <div class="status-dot"></div>
                    <span>SYNCED</span>
                </div>
            </div>
        </div>
        
        <div class="terminal-box">
            <div class="terminal-header">
                <div class="terminal-dot dot-1"></div>
                <div class="terminal-dot dot-2"></div>
                <div class="terminal-dot dot-3"></div>
            </div>
            
            <div class="welcome-cyber">
                <h1 class="cyber-title">NEURAL INTERFACE</h1>
                <p class="cyber-subtitle">Access the knowledge matrix</p>
            </div>
            
            <div class="input-terminal">
                <div class="input-line">
                    <span class="prompt">$</span>
                    <input 
                        type="text" 
                        class="cyber-input" 
                        placeholder="Enter command or query..."
                    />
                </div>
                <div class="mode-selector">
                    <button class="mode-btn">Standard</button>
                    <button class="mode-btn">Deep Scan</button>
                    <button class="mode-btn">Creative</button>
                    <button class="send-cyber">Execute</button>
                </div>
            </div>
            
            <div class="quick-commands">
                <div class="command-card">
                    <div class="command-icon">🔍</div>
                    <div class="command-text">Deep Research</div>
                </div>
                <div class="command-card">
                    <div class="command-icon">⚡</div>
                    <div class="command-text">Quick Analysis</div>
                </div>
                <div class="command-card">
                    <div class="command-icon">🎨</div>
                    <div class="command-text">Generate Art</div>
                </div>
                <div class="command-card">
                    <div class="command-icon">💾</div>
                    <div class="command-text">Data Mining</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
